name: Tests
# Fleet CI for this product fork (wave 2). Mechanics live in bvisible/neoffice-ci
# (frappe-app-ci.yml): bench init on OUR frappe fork, deps, blocking build, run-tests,
# report to the hub (one [CI] issue per repo, closed by the green).
# Nightly + PR + on demand — not on push: the upstream CI and the build bot
# already run there, a second run per bot commit would only add noise.
on:
  schedule:
    - cron: "7 5 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
concurrency:
  group: tests-${{ github.ref }}
  # A scheduled or manual run no longer cuts the run before it: it waits behind the running one, and a
  # run still waiting gives way to a newer one, so one runs and one waits at most. The runs of a pull
  # request still cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: frappe_assistant_core
      # The suite asserts against Customer, Sales Invoice, Quotation…: the hub runs ERPNext and so does the bench.
      install_apps: "erpnext"
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET (deps are public forks: no read token needed)
    secrets: inherit
